<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comic Panels Reveal</title>
  <style>
    body {
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .panel-container {
      position: relative;
      width: 600px;
      height: 400px;
    }

    .panel {
      position: absolute;
      width: 300px;
      height: 300px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
    }

    /* white cover overlay */
    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: white;
      transition: opacity 0.4s ease;
    }

    .panel.revealed::before {
      opacity: 0;
    }

    /* individual positions */
    .panel1 { top: 400px; left: 00px; transform: rotate(-10deg); }
    .panel2 { top: -150px; left: 200px; transform: rotate(5deg); }
    .panel3 { top: 400px; left: 400px; transform: rotate(10deg); }
    .panel4 { top: 130px; left: 200px; border-radius: 50%; }
  </style>
</head>
<body>
  <div class="panel-container">
    <div class="panel panel1" style="background-image: url('panel1.jpg')"></div>
    <div class="panel panel2" style="background-image: url('panel2.jpg')"></div>
    <div class="panel panel3" style="background-image: url('panel3.jpg')"></div>
    <div class="panel panel4" style="background-image: url('panel4.jpg')"></div>
  </div>

  <script>
    const panels = document.querySelectorAll('.panel');

    panels.forEach(panel => {
      panel.addEventListener('click', () => {
        panel.classList.add('revealed');
      });
    });
  </script>
</body>
</html>
