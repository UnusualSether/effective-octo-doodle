<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comic Panels</title>

    <style>
        /* === GENERAL PAGE SETUP === */
        body {
            background: black; /* Set background color to black for contrast */
            display: flex; /* Use flexbox to arrange panels */
            flex-direction: column; /* Telling the flex to go top to bottom*/
            justify-content: flex-start; /* Center panels vertically */
            align-items: center; /* Center panels vertically in the viewport */
            min-height: 100vh; /* Make sure body takes up full viewport height */
            margin: 0; /* Remove default page margins */
            padding: 20px; /* Add padding around the panels */
        }

        /* === PANEL STYLING === */
        .panel {
            width: 300px; /* Fixed width for each comic panel */
            height: 300px; /* Fixed height (makes them square) */
            background-size: cover; /* Scale background image to fill the panel */
            background-position: center; /* Center the image inside the panel */
           
            /* Soft glow around panels */
        }

        /* === INDIVIDUAL PANELS === */
        /* Each of these assigns a different image to a panel */

        .panel1 {
            background-image: url('Panel1.png'); /* First comic image */
            margin-bottom: 0px;
        }

        .panel2 {
            background-image: url('Panel2.png'); /* Second comic image */
            margin-top: -25px;
        }

        .panel3 {
            background-image: url('panel3.jpg'); /* Third comic image */

            margin-top: 40px;
        }
    </style>
</head>

<body>
    <!-- === COMIC PANELS === -->
    <!-- Each div represents one comic panel square -->
    <div class="panel panel1"></div>  <!-- Panel 1 -->
    <div class="panel panel2"></div>  <!-- Panel 2 -->
    <div class="panel panel3"></div>  <!-- Panel 3 -->
</body>
</html>
