<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comic Panels Reveal</title>
  <style>
    body {
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .panel-container {
      position: relative;
      width: 600px;
      height: 400px;
    }

    .panel {
      position: absolute;
      width: 700px;
      height: 700px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
    }

    /* white cover overlay */
    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: white;
      transition: opacity 0.4s ease;
    }

    .panel.revealed::before {
      opacity: 0;
    }

    /* Losange / diagonal panel shapes */
.losange2 {
  clip-path: polygon(0 20%, 100% 0, 100% 80%, 0 100%);
}

.losange1 {
  clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 80%);
}

    /* individual positions */
    .panel.losange1 { top: -600px; left: 100px;  }
    .panel.losange2 { top: -225px; left: 100px; }
    .panel3 { top: 500px; left: 100px; }
  </style>
</head>
<body>
  <div class="panel-container">
    <div class="panel losange1" style="background-image: url('Panel1.png')"></div>
    <div class="panel losange2" style="background-image: url('Panel2.png')"></div>
    <div class="panel panel3" style="background-image: url('panel3.jpg')"></div>
  </div>

  <script>
    const panels = document.querySelectorAll('.panel');

    panels.forEach(panel => {
      panel.addEventListener('click', () => {
        panel.classList.add('revealed');
      });
    });
  </script>
</body>
</html>
